[package]
name = "eqr"
version = "1.9.88"
edition = "2024"
rust-version = "1.88.0"
authors = ["github.com/pepa65 <pepa65@passchier.net>", "Marco Radocchia <mar.radocchia@proton.me>"]
description = "Encode text into svg/png/jpg/terminal-format QR codes with optional logo"
repository = "https://github.com/pepa65/eqr"
documentation = "https://docs.rs/eqr"
readme = "README.md"
license = "GPL-3.0-only"
keywords = ["qr", "encode", "generator", "image", "terminal"]
categories = ["command-line-utilities", "computer-vision", "encoding"]

[[bin]]
name = "qr"
path = "src/main.rs"

[[bin]]
name = "promptpay"
path = "src/promptpay.rs"

[package.metadata.binstall]
pkg-url = "{repo}/releases/download/{version}/eqr.tgz"
pkg-fmt = "Tgz"
disabled-strategies = ["quick-install", "compile"]
target-family = "Linux"
target-arch = "X86_64"

[dependencies]
qrcodegen = "1.8"
clap = { version = "4.6", features = ["derive"] }
termcolor = "1.4.1"
dialoguer = "0.12"
regex = "1.13"
lazy_static = "1.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
tempfile = "3"

[build-dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_mangen = "0.3"
clap_complete = "4.6"
qrcodegen = "1.8.0"
lazy_static = "1.5.0"
regex = "1.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
